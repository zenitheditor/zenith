[workspace]
resolver = "3"
members = [
    "zenith-core",
    "zenith-layout",
    "zenith-raster",
    "zenith-perception",
    "zenith-geometry",
    "zenith-scene",
    "zenith-render",
    "zenith-tx",
    "zenith-cli",
    "zenith-session",
    "zenith-zpx",
    "zenith-producers",
    "zenith-pipeline",
    "zenith-editor",
    "zenith-editor/benches",
    "zenith-editor-wasm",
]

[workspace.package]
version = "0.0.10"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/zenitheditor/zenith"
homepage = "https://github.com/zenitheditor/zenith"
description = "Zenith — a deterministic, agent-native design-document format and engine."
readme = "README.md"
keywords = ["design", "deterministic", "kdl", "rendering", "agent"]
categories = ["rendering", "command-line-utilities", "visualization"]
publish = true

# Internal crates are referenced through the workspace so a single version is
# stamped at release time (see .github/workflows/release.yml). The `version`
# requirement is what ships to crates.io; the `path` is used for local builds.
[workspace.dependencies]
# Default features off: the bundled-font set is chosen per binary. A crate that
# needs the full set (the CLI) adds `features = ["bundled-fonts-extended"]`.
# Test builds of library crates add it as a dev-dependency.
zenith-core = { version = "=0.0.10", path = "zenith-core", default-features = false }
zenith-layout = { version = "=0.0.10", path = "zenith-layout" }
zenith-raster = { version = "=0.0.10", path = "zenith-raster" }
zenith-perception = { version = "=0.0.10", path = "zenith-perception" }
zenith-geometry = { version = "=0.0.10", path = "zenith-geometry" }
zenith-scene = { version = "=0.0.10", path = "zenith-scene" }
zenith-render = { version = "=0.0.10", path = "zenith-render" }
zenith-tx = { version = "=0.0.10", path = "zenith-tx" }
zenith-session = { version = "=0.0.10", path = "zenith-session" }
zenith-zpx = { version = "=0.0.10", path = "zenith-zpx" }
zenith-producers = { version = "=0.0.10", path = "zenith-producers" }
zenith-pipeline = { version = "=0.0.10", path = "zenith-pipeline" }
zenith-editor = { version = "=0.0.10", path = "zenith-editor" }

# Size-tuned build of `zenith-editor-wasm` for the browser:
#   cargo build --profile release-wasm --target wasm32-wasip1 -p zenith-editor-wasm
# Output stays deterministic. Floating-point results do not depend on the
# optimization level or LTO.
[profile.release-wasm]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = "s"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
