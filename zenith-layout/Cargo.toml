[package]
name = "zenith-layout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
readme.workspace = true
description = "Zenith text shaping and font metrics (rustybuzz + ttf-parser)."

[dependencies]
zenith-core = { workspace = true }
zenith-geometry = { workspace = true }
rustybuzz = "0.20"
unicode-bidi = "0.3.18"
unicode-linebreak = "0.1.5"

[dev-dependencies]
# Tests use the serif and mono faces.
zenith-core = { workspace = true, features = ["bundled-fonts-extended"] }
# Bidi, CJK, and emoji tests shape with the fallback faces.
zenith-fonts-fallback = { workspace = true, features = ["embed"] }

[lints]
workspace = true
