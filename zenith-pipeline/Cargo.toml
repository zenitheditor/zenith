[package]
name = "zenith-pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
readme.workspace = true
description = "Zenith render orchestration over host I/O traits: config policy, composition imports, fonts, assets, compile, and render."

# Every dependency is pure Rust, so the C-free invariant holds. The crate
# performs no I/O of its own: hosts supply files, config, and local fonts
# through the traits in `io`.
[dependencies]
zenith-core = { workspace = true }
zenith-layout = { workspace = true }
zenith-scene = { workspace = true }
zenith-render = { workspace = true }
serde_json = "1"
sha2 = "0.10"
csv = "1"
imagesize = "0.12"

[lints]
workspace = true

[dev-dependencies]
# Tests use the serif and mono faces.
zenith-core = { workspace = true, features = ["bundled-fonts-extended"] }
tempfile = "3"
