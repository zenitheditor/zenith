# Reusable test suite. Called by ci.yml (PR gate) and release.yml (pre-publish
# gate) so both run the exact same checks.
#
# The OS matrix is load-bearing: Zenith's hard rule is byte-identical output on
# any machine, so the render/test suite must pass on Linux, macOS, and Windows.

name: Test

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The editor browser tests start Chrome. Ubuntu 24.04 runners can block the
  # user namespaces its sandbox needs, so the tests pass `--no-sandbox`.
  ZENITH_E2E_NO_SANDBOX: "1"

jobs:
  lint:
    name: Lint, format & docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: lint
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Build docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --locked --no-deps
      - name: Doctests
        run: cargo test --workspace --all-features --locked --doc

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      # The page tests need Node 22 (built-in `WebSocket`).
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: test
      # `zenith-cli/tests/editor_page.rs` prints `SKIP ...` and passes when the
      # wasm module, Node, or Chromium is missing. This job builds no wasm
      # module, so the static-host and native-vs-wasm tests skip here on
      # purpose. The `editor-wasm` job runs them with every prerequisite
      # required.
      - name: Run tests
        run: cargo test --workspace --all-features --locked

  editor-wasm:
    name: Editor on wasm (native-vs-wasm byte equality)
    runs-on: ubuntu-latest
    env:
      # A missing prerequisite is an error here, never a silent skip.
      ZENITH_E2E_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust with the wasm32-wasip1 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: editor-wasm
      - name: Build the editor wasm module
        run: cargo build --profile release-wasm --target wasm32-wasip1 -p zenith-editor-wasm --locked
      - name: Locate Chromium
        # ubuntu-latest ships Google Chrome. The tests read the path from
        # ZENITH_E2E_CHROMIUM.
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$chrome" --version
          echo "ZENITH_E2E_CHROMIUM=$chrome" >> "$GITHUB_ENV"
          echo "ZENITH_E2E_WASM=$GITHUB_WORKSPACE/target/wasm32-wasip1/release-wasm/zenith-editor-wasm.wasm" >> "$GITHUB_ENV"
      - name: Page, static-host and native-vs-wasm tests
        # Runs the hash sweep over examples/*.zen: native `zenith edit` vs the
        # wasm engine in Chromium. Any byte difference fails the test.
        run: cargo test -p zenith-tool --test editor_page --locked -- --nocapture

  msrv:
    name: Minimum Rust version (1.95.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: msrv-1.95.0
      - name: Check all targets and features
        run: cargo check --workspace --all-targets --all-features --locked

  package:
    name: Package archives and embedded assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: release-packages
          cache-directories: target/release-readiness
      # `publish = false` crates are not released. Cargo packages them with
      # `--workspace` unless excluded, and the bench crate reads files outside
      # its directory.
      - name: Package all workspace crates
        run: cargo package --workspace --exclude zenith-editor-bench --exclude zenith-editor-wasm --all-features --locked --allow-dirty --target-dir target/release-readiness
      - name: Check package contents
        run: python3 scripts/check-release-packages.py target/release-readiness/package
      - name: Smoke packaged CLI
        run: |
          target/release-readiness/debug/zenith --version
          target/release-readiness/debug/zenith library list --json
      - name: Create plugin smoke directory
        run: mkdir -p "${{ runner.temp }}/zenith-plugin-smoke"
      - name: Smoke packaged plugin assets
        working-directory: ${{ runner.temp }}/zenith-plugin-smoke
        run: |
          "${{ github.workspace }}/target/release-readiness/debug/zenith" plugin install --codex --scope project
          test -f .agents/skills/zenith/SKILL.md
