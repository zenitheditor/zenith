[package]
name = "zenith-scene"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
readme.workspace = true
description = "Zenith backend-neutral scene IR and compilation (geometry, text wrap, anchors, opacity, clip)."

[dependencies]
zenith-core = { workspace = true }
zenith-geometry = { workspace = true }
zenith-layout = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hyphenation = { version = "0.8.4", default-features = false, features = ["embed_en-us"] }

[dev-dependencies]
# Tests use the serif and mono faces.
zenith-core = { workspace = true, features = ["bundled-fonts-extended"] }
# Bidi, CJK, and emoji tests shape with the fallback faces.
zenith-fonts-fallback = { workspace = true, features = ["embed"] }

[lints]
workspace = true
