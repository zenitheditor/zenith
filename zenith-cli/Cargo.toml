[package]
# Published to crates.io as `zenith-tool` (the plain `zenith`/`zenith-cli`
# names are already taken by unrelated crates). The installed binary is still
# `zenith`; the crate directory stays `zenith-cli`.
name = "zenith-tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
readme.workspace = true
description = "The Zenith command-line interface (the `zenith` binary) for the design-document toolchain."

# The package publishes as `zenith-tool`, but the library target keeps the
# `zenith_cli` name so `main.rs` and the integration tests import it unchanged.
[lib]
name = "zenith_cli"
path = "src/lib.rs"

[[bin]]
name = "zenith"
path = "src/main.rs"

[dependencies]
zenith-core = { workspace = true, features = ["bundled-fonts-extended"] }
zenith-geometry = { workspace = true }
zenith-layout = { workspace = true }
zenith-tx = { workspace = true }
zenith-scene = { workspace = true }
zenith-render = { workspace = true }
zenith-session = { workspace = true }
zenith-perception = { workspace = true }
zenith-producers = { workspace = true }
zenith-zpx = { workspace = true }
zenith-pipeline = { workspace = true }
zenith-editor = { workspace = true }
clap = { version = "4", features = ["derive"] }
# `library.kdl` manifests of SVG icon libraries. Same version zenith-core parses
# `.zen` with, so no second KDL implementation enters the graph.
kdl = "6.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
csv = "1"
tempfile = "3"
# Parallel page compile and raster for multi-page renders. Pure Rust and
# already in the lock via `jpeg-decoder`, so the C-free invariant holds.
rayon = "1.12"
# Ctrl-C and SIGTERM for `zenith edit`. Pure-Rust bindings: `nix` (over `libc`)
# on Unix, `windows-sys` on Windows, `dispatch2` on Apple. No C is compiled,
# and the `unsafe` stays inside the crate, so the C-free invariant and
# `unsafe_code = "forbid"` hold. `termination` adds SIGTERM and SIGHUP.
ctrlc = { version = "3.5", features = ["termination"] }

[features]
default = []
# Enable the in-binary HTTP transport for `zenith mcp --http` (otherwise `--http`
# reports it was built out). It runs on the bounded `std::net` HTTP layer of
# `zenith edit`, so it adds no dependency.
http = []

[dev-dependencies]
tiny-skia = "0.11"
# Used only by the icon render-equivalence test to rasterize the SOURCE SVG the
# same way the render backend does (resvg re-exports usvg). Already in the lock
# via zenith-render; pure-Rust, so the C-free invariant holds.
resvg = "0.36"

[lints]
workspace = true
