<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body { width: 960px; height: 700px; background: #0f172a; font-family: "Noto Sans", sans-serif; position: relative; overflow: hidden; }
  .title { position: absolute; left: 40px; top: 32px; margin: 0; color: #fff; font-size: 36px; font-weight: 700; line-height: 48px; }
  .sub { position: absolute; left: 40px; top: 80px; margin: 0; color: #cbd5e1; font-size: 16px; line-height: 24px; }
  .grid { position: absolute; left: 40px; top: 120px; width: 880px; display: flex; flex-wrap: wrap; gap: 20px; }
  .card { box-sizing: border-box; width: 280px; height: 160px; padding: 20px; display: flex; flex-direction: column; gap: 8px; background: #1e293b; border-radius: 16px; }
  .label { color: #cbd5e1; font-size: 14px; }
  .value { color: #fff; font-size: 44px; font-weight: 700; }
  .delta { color: #34d399; font-size: 16px; font-weight: 700; }
</style>
</head>
<body>
  <h1 class="title">Q2 Metrics</h1>
  <p class="sub">Updated today</p>
  <div class="grid">
    <div class="card">
      <div class="label">Visitors</div>
      <div class="value">48.2k</div>
      <div class="delta">+12%</div>
    </div>
    <div class="card">
      <div class="label">Revenue</div>
      <div class="value">$91.4k</div>
      <div class="delta">+8%</div>
    </div>
    <div class="card">
      <div class="label">Orders</div>
      <div class="value">1,204</div>
      <div class="delta">+5%</div>
    </div>
    <div class="card">
      <div class="label">Refunds</div>
      <div class="value">38</div>
      <div class="delta">+2%</div>
    </div>
    <div class="card">
      <div class="label">Signups</div>
      <div class="value">912</div>
      <div class="delta">+17%</div>
    </div>
    <div class="card">
      <div class="label">Support</div>
      <div class="value">214</div>
      <div class="delta">+3%</div>
    </div>
  </div>
</body>
</html>
