<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body { width: 800px; height: 500px; background: #0f172a; font-family: "Noto Sans", sans-serif; position: relative; overflow: hidden; }
  .left { position: absolute; left: 48px; top: 48px; width: 392px; height: 404px; display: flex; flex-direction: column; gap: 20px; }
  .label { height: 20px; color: #7dd3fc; font-size: 14px; font-weight: 700; letter-spacing: 2px; }
  .headline { height: 110px; margin: 0; color: #fff; font-size: 44px; font-weight: 700; line-height: 1.25; }
  .body { height: 96px; margin: 0; color: #cbd5e1; font-size: 18px; line-height: 1.4; }
  .button { width: 180px; height: 52px; background: #2563eb; border-radius: 10px; color: #fff; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .card { position: absolute; left: 480px; top: 48px; width: 272px; height: 404px; background: #1e293b; border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .stat { color: #fff; font-size: 64px; font-weight: 700; }
  .caption { color: #cbd5e1; font-size: 18px; }
</style>
</head>
<body>
  <div class="left">
    <div class="label">NEW RELEASE</div>
    <h1 class="headline">Ship faster with Zenith</h1>
    <p class="body">Design documents your agents can read, edit and render the same way every time.</p>
    <div class="button">Get started</div>
  </div>
  <div class="card">
    <div class="stat">99.9%</div>
    <div class="caption">uptime across 3 regions</div>
  </div>
</body>
</html>
